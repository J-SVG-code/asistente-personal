<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Local AI</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #111827;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
            color: #38bdf8;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user {
            background-color: #0284c7;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .assistant {
            background-color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #0b0f19;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }
        button {
            padding: 0 20px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>JARVIS Local AI</header>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribe un mensaje o pregunta..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
            });
        }

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        window.onload = () => {
            appendMessage('JARVIS en línea. Sistemas operativos listos.', 'assistant');
        };

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            const loadingId = 'loading-' + Date.now();
            appendMessage('Procesando...', 'assistant', loadingId);

            setTimeout(() => {
                const removeLoading = document.getElementById(loadingId);
                if (removeLoading) removeLoading.remove();

                let reply = motorInteligente(text);
                appendMessage(reply, 'assistant');
            }, 400);
        }

        function motorInteligente(texto) {
            const t = texto.toLowerCase();

            if (t.includes('hola') || t.includes('hey') || t.includes('saludos')) {
                return '¡Hola! Sistemas operativos al 100%. ¿Qué operativas ejecutamos hoy?';
            } 
            else if (t.includes('america') || t.includes('américa') || t.includes('descubrió') || t.includes('descubrio')) {
                return 'América fue avistada oficialmente por Cristóbal Colón el 12 de octubre de 1492, respaldado por la corona española.';
            } 
            else if (t.includes('tierra') || t.includes('mide') || t.includes('diametro') || t.includes('diámetro')) {
                return 'La Tierra tiene un diámetro ecuatorial aproximado de 12.742 kilómetros.';
            }
            else if (t.includes('aplicaciones') || t.includes('crear') || t.includes('app')) {
                return 'Afirmativo. Puedo estructurar lógica de programación, interfaces web, scripts y arquitecturas PWA.';
            }
            else {
                return `Comando procesado: "${texto}". Ejecución completada exitosamente por el núcleo local de JARVIS.`;
            }
        }

        function appendMessage(text, sender, id = null) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            if (id) div.id = id;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
