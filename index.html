<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Personal Autónomo</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .app-card { max-width: 650px; margin: auto; background: var(--panel); border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .online { background: #10b981; color: #000; }
        .offline { background: #f59e0b; color: #000; }
        .chat-box { height: 300px; overflow-y: auto; background: #090d16; border-radius: 8px; padding: 12px; margin-bottom: 15px; font-size: 14px; line-height: 1.5; white-space: pre-line; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 90%; }
        .msg.user { background: #2563eb; margin-left: auto; color: white; }
        .msg.ai { background: #334155; color: #f8fafc; }
        .controls input, .controls textarea { width: 100%; box-sizing: border-box; background: #090d16; color: #fff; border: 1px solid #475569; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .btn-main { background: var(--accent); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h3>🤖 Tu Asistente Personal</h3>
        <span id="netStatus" class="status-badge online">ONLINE</span>
    </div>

    <!-- Historial de Conversación -->
    <div class="chat-box" id="chatBox">
        <div class="msg ai">¡Sistematoolbox activo! Puedo hacer cálculos, guardar notas, darte la hora y ejecutar comandos seguros con tu PIN (7777). Pruebame escribiendo:
- "calcula 50 * 20"
- "nota Comprar suministros"
- "mis notas"
- "hora"</div>
    </div>

    <!-- Controles de Entrada y Verificación -->
    <div class="controls">
        <textarea id="userInput" placeholder="Escribe tu orden o instrucción aquí..."></textarea>
        <input type="password" id="masterCode" placeholder="🔒 PIN Maestro (7777)">
        <button class="btn-main" onclick="procesarEntrada()">Ejecutar Acción</button>
    </div>
</div>

<script>
    const PIN_MAESTRO = "7777"; 
    let memoriaLocal = JSON.parse(localStorage.getItem("memoria_asistente") || "[]");

    function actualizarRed() {
        const status = document.getElementById("netStatus");
        if (navigator.onLine) {
            status.textContent = "ONLINE";
            status.className = "status-badge online";
        } else {
            status.textContent = "OFFLINE";
            status.className = "status-badge offline";
        }
    }
    window.addEventListener('online', actualizarRed);
    window.addEventListener('offline', actualizarRed);
    actualizarRed();

    function agregarMensaje(texto, emisor) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `msg ${emisor}`;
        msgDiv.textContent = texto;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function procesarEntrada() {
        const input = document.getElementById("userInput");
        const pinInput = document.getElementById("masterCode");
        const texto = input.value.trim();
        const pin = pinInput.value;

        if (!texto) return;

        agregarMensaje(texto, "user");
        input.value = "";

        const textoMinus = texto.toLowerCase();
        let respuestaIA = "";

        // Verificación de comandos protegidos por PIN
        const requierePin = textoMinus.includes("borrar") || textoMinus.includes("limpiar memoria");
        if (requierePin && pin !== PIN_MAESTRO) {
            agregarMensaje("🔒 Acción denegada: Necesitas ingresar el PIN Maestro correcto (7777) para ejecutar comandos críticos.", "ai");
            return;
        }

        // Lógica de Toolbox y ejecución de tareas reales
        if (textoMinus.startsWith("calcula ") || textoMinus.startsWith("calcular ")) {
            try {
                let expresion = texto.replace(/calcula|calcular/gi, '').trim();
                let resultado = eval(expresion);
                respuestaIA = `🧮 Resultado de (${expresion}) = ${resultado}`;
            } catch (e) {
                respuestaIA = "⚠️ No pude procesar esa operación matemática. Revisa la sintaxis.";
            }
        } else if (textoMinus.startsWith("nota ") || textoMinus.startsWith("anotar ")) {
            let contenidoNota = texto.replace(/nota|anotar/gi, '').trim();
            let notas = JSON.parse(localStorage.getItem("mis_notas") || "[]");
            notas.push(contenidoNota);
            localStorage.setItem("mis_notas", JSON.stringify(notas));
            respuestaIA = `📝 Nota guardada con éxito en el dispositivo.\nTotal de notas: ${notas.length}`;
        } else if (textoMinus.includes("mis notas" ) || textoMinus.includes("ver notas")) {
            let notas = JSON.parse(localStorage.getItem("mis_notas") || "[]");
            if (notas.length === 0) {
                respuestaIA = "📭 No tienes notas guardadas todavía. Escribe 'nota [tu texto]' para crear una.";
            } else {
                respuestaIA = "📋 Tus notas guardadas:\n" + notas.map((n, i) => `${i + 1}. ${n}`).join("\n");
            }
        } else if (textoMinus.includes("hora") || textoMinus.includes("fecha") || textoMinus.includes("tiempo")) {
            respuestaIA = `🕒 Fecha y hora actual: ${new Date().toLocaleString()}`;
        } else if (textoMinus.includes("estado") || textoMinus.includes("sistema")) {
            let notasCount = JSON.parse(localStorage.getItem("mis_notas") || "[]").length;
            respuestaIA = `⚙️ Estado del Sistema:\n- Almacenamiento local: Activo\n- Registros en memoria: ${memoriaLocal.length}\n- Notas guardadas: ${notasCount}\n- Conectividad: ${navigator.onLine ? 'Online' : 'Offline'}`;
        } else if (textoMinus.startsWith("borrar memoria") || textoMinus.startsWith("limpiar memoria")) {
            localStorage.removeItem("memoria_asistente");
            localStorage.removeItem("mis_notas");
            memoriaLocal = [];
            respuestaIA = "🗑️ Memoria y notas eliminadas por completo utilizando el PIN Maestro.";
        } else if (textoMinus.includes("hola") || textoMinus.includes("saludos")) {
            respuestaIA = "¡Hola! Tu toolbox autónomo está listo para operar. ¿Qué tarea ejecutamos?";
        } else {
            // Registro general de entradas
            memoriaLocal.push({ fecha: new Date().toISOString(), entrada: texto });
            localStorage.setItem("memoria_asistente", JSON.stringify(memoriaLocal));
            respuestaIA = `✅ Orden procesada y registrada: "${texto}". (Tip: Puedes pedirme calcular operaciones, tomar notas, ver la hora o consultar el estado del sistema).`;
        }

        agregarMensaje(respuestaIA, "ai");
    }
</script>

</body>
</html>
