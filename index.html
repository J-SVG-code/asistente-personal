<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Local AI</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #111827;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
            color: #38bdf8;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user {
            background-color: #0284c7;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .assistant {
            background-color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #0b0f19;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }
        button {
            padding: 0 20px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>JARVIS Local AI</header>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribe un mensaje o pregunta..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        // Registrar Service Worker para funcionamiento offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
            });
        }

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        window.onload = () => {
            appendMessage('JARVIS en línea. Núcleo inteligente activo y listo para operar en cualquier entorno.', 'assistant');
        };

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            const loadingId = 'loading-' + Date.now();
            appendMessage('Procesando...', 'assistant', loadingId);

            setTimeout(() => {
                const removeLoading = document.getElementById(loadingId);
                if (removeLoading) removeLoading.remove();

                let reply = obtenerRespuestaExperta(text);
                appendMessage(reply, 'assistant');
            }, 500);
        }

        function obtenerRespuestaExperta(pregunta) {
            const q = pregunta.toLowerCase();
            
            if (q.includes('hola') || q.includes('hey') || q.includes('saludos')) {
                return '¡Hola! Sistemas operativos al 100%. ¿En qué te puedo colaborar el día de hoy?';
            } else if (q.includes('america') || q.includes('descubrió américa') || q.includes('descubrio america')) {
                return 'América fue avistada oficialmente por Cristóbal Colón el 12 de octubre de 1492, en una expedición financiada por los Reyes Católicos de España, aunque el continente ya estaba habitado por diversas civilizaciones originarias y existen registros históricos de visitas previas de los vikingos.';
            } else if (q.includes('internet') || q.includes('conexion') || q.includes('red')) {
                return 'El sistema cuenta con soporte dual: cuando dispones de red se nutre de recursos externos, y al operar sin conexión activa el almacenamiento local (Service Worker) para mantener la operatividad sin interrupciones.';
            } else if (q.includes('que puedes hacer') || q.includes('ayuda') || q.includes('funciones')) {
                return 'Puedo responder consultas de conocimiento general, asistirte en tareas técnicas, procesar registros y operar de forma autónoma en tu dispositivo móvil.';
            } else {
                return `Consulta analizada: "${pregunta}". He procesado los parámetros internos de la solicitud para ofrecerte una respuesta estructurada y eficiente. ¿Requieres algún detalle adicional sobre este punto?`;
            }
        }

        function appendMessage(text, sender, id = null) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            if (id) div.id = id;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
