<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Local AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #111827;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
            color: #38bdf8;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user {
            background-color: #0284c7;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .assistant {
            background-color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #0b0f19;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }
        button {
            padding: 0 20px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>JARVIS Local AI</header>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribe un mensaje..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const BACKEND_URL = 'http://localhost:3000/chat';

        window.onload = async () => {
            try {
                const res = await fetch('http://localhost:3000/history');
                const history = await res.json();
                history.reverse().forEach(msg => {
                    appendMessage(msg.content, msg.role === 'user' ? 'user' : 'assistant');
                });
            } catch (e) {
                appendMessage('No se pudo conectar con el servidor local.', 'assistant');
            }
        };

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage(data.reply, 'assistant');
            } catch (e) {
                appendMessage('Error de conexión con el servidor.', 'assistant');
            }
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
